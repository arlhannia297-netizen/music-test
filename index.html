<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chord Strummer — Tạo đệm guitar từ hợp âm</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --panel-2: #232732;
    --accent: #f59e0b;
    --accent-2: #fbbf24;
    --text: #e6e8eb;
    --muted: #9aa0a6;
    --border: #2c3140;
    --good: #34d399;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px;
  }
  .container { max-width: 880px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 24px; }
  h1 { margin: 0 0 8px; font-size: 28px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }

  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }

  input[type="text"], select {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
  }
  input[type="text"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }

  .row { display: grid; gap: 12px; grid-template-columns: 1fr 1fr 1fr; }
  .row-2 { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 600px) {
    .row, .row-2 { grid-template-columns: 1fr; }
  }

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button {
    background: var(--accent);
    color: #1a1300;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: var(--accent-2); }
  button.secondary {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.secondary:hover { background: #2c3140; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .chord-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pill {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 10px;
    border-radius: 16px;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
  }
  .pill:hover { border-color: var(--accent); color: var(--text); }

  .status {
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
    min-height: 18px;
  }
  .status.error { color: var(--bad); }
  .status.success { color: var(--good); }
  .status.loading { color: var(--accent); }

  .now-playing {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .now-playing .chord-box {
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: 600;
    transition: all 0.1s;
  }
  .now-playing .chord-box.active {
    background: var(--accent);
    color: #1a1300;
    border-color: var(--accent);
    transform: scale(1.05);
  }

  .preset-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .preset-row .pill { background: transparent; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 32px;
  }
  code {
    background: var(--panel-2);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎸 Chord Strummer</h1>
      <p>Nhập chuỗi hợp âm — nghe demo đệm guitar — tải file WAV.</p>
    </header>

    <div class="panel">
      <label for="chords">Chuỗi hợp âm (cách nhau bằng dấu cách hoặc phẩy)</label>
      <input id="chords" type="text" value="C G Am F" autocomplete="off" />
      <div class="preset-row">
        <span class="pill" data-preset="C G Am F">Pop: C G Am F</span>
        <span class="pill" data-preset="Am F C G">Sad pop: Am F C G</span>
        <span class="pill" data-preset="Em C G D">Ballad: Em C G D</span>
        <span class="pill" data-preset="G D Em C">Country: G D Em C</span>
        <span class="pill" data-preset="Dm G C Am">Jazzy: Dm G C Am</span>
      </div>

      <div class="row" style="margin-top: 16px;">
        <div>
          <label for="bpm">Tempo (BPM)</label>
          <input id="bpm" type="text" value="90" />
        </div>
        <div>
          <label for="bars">Số ô nhịp / hợp âm</label>
          <select id="bars">
            <option value="1" selected>1 ô nhịp</option>
            <option value="2">2 ô nhịp</option>
            <option value="4">4 ô nhịp</option>
          </select>
        </div>
        <div>
          <label for="pattern">Pattern strum</label>
          <select id="pattern">
            <option value="D-DU-UDU" selected>D-DU-UDU (pop chuẩn)</option>
            <option value="D-D-D-D-">D-D-D-D- (đơn giản)</option>
            <option value="D-DUUDUDU">D-DUUDUDU (sôi động)</option>
            <option value="D---D---">D---D--- (ballad chậm)</option>
            <option value="DUDUDUDU">DUDUDUDU (đều liên tục)</option>
            <option value="D-DU-UDU-DU-UDU-">2-bar D-DU-UDU x 2</option>
          </select>
        </div>
      </div>

      <div class="row-2" style="margin-top: 12px;">
        <div>
          <label for="tone">Tone (chất âm)</label>
          <select id="tone">
            <option value="acoustic" selected>Acoustic (mộc, cân bằng)</option>
            <option value="warm">Warm (ấm, dày)</option>
            <option value="bright">Bright (sáng, đanh)</option>
          </select>
        </div>
        <div>
          <label for="reverb">Reverb (vang)</label>
          <select id="reverb">
            <option value="0">Khô (không reverb)</option>
            <option value="1" selected>Phòng nhỏ</option>
            <option value="2">Phòng lớn</option>
            <option value="3">Hall (hội trường)</option>
          </select>
        </div>
      </div>

      <div class="btn-row">
        <button id="playBtn">▶ Play</button>
        <button id="stopBtn" class="secondary" disabled>⏹ Stop</button>
        <button id="downloadBtn" class="secondary">⬇ Tải WAV</button>
      </div>

      <div id="status" class="status"></div>
      <div id="nowPlaying" class="now-playing"></div>
    </div>

    <div class="panel">
      <label>Hợp âm hỗ trợ (click để chèn vào input)</label>
      <div id="chordList" class="chord-pills"></div>
    </div>

    <footer>
      <p>
        Tổng hợp bằng Karplus-Strong + EQ + Convolution Reverb qua Web Audio API.
        CLI Python: <code>python chord_strum.py "C G Am F" -o song.wav</code>
      </p>
    </footer>
  </div>

<script>
"use strict";

// ===========================================================================
// Thư viện hợp âm
// ===========================================================================
const OPEN_STRING_FREQS = [
  82.4069,   // E2 - dây 6 (trầm)
  110.0000,  // A2
  146.8324,  // D3
  195.9977,  // G3
  246.9417,  // B3
  329.6276,  // E4 - dây 1 (cao)
];

const CHORD_SHAPES = {
  "C":     [null, 3, 2, 0, 1, 0],
  "D":     [null, null, 0, 2, 3, 2],
  "E":     [0, 2, 2, 1, 0, 0],
  "F":     [1, 3, 3, 2, 1, 1],
  "G":     [3, 2, 0, 0, 0, 3],
  "A":     [null, 0, 2, 2, 2, 0],
  "B":     [null, 2, 4, 4, 4, 2],
  "Cm":    [null, 3, 5, 5, 4, 3],
  "Dm":    [null, null, 0, 2, 3, 1],
  "Em":    [0, 2, 2, 0, 0, 0],
  "Fm":    [1, 3, 3, 1, 1, 1],
  "Gm":    [3, 5, 5, 3, 3, 3],
  "Am":    [null, 0, 2, 2, 1, 0],
  "Bm":    [null, 2, 4, 4, 3, 2],
  "C7":    [null, 3, 2, 3, 1, 0],
  "D7":    [null, null, 0, 2, 1, 2],
  "E7":    [0, 2, 0, 1, 0, 0],
  "G7":    [3, 2, 0, 0, 0, 1],
  "A7":    [null, 0, 2, 0, 2, 0],
  "B7":    [null, 2, 1, 2, 0, 2],
  "Am7":   [null, 0, 2, 0, 1, 0],
  "Dm7":   [null, null, 0, 2, 1, 1],
  "Em7":   [0, 2, 2, 0, 3, 0],
  "Cmaj7": [null, 3, 2, 0, 0, 0],
  "Dmaj7": [null, null, 0, 2, 2, 2],
  "Fmaj7": [null, null, 3, 2, 1, 0],
  "Gmaj7": [3, 2, 0, 0, 0, 2],
  "Amaj7": [null, 0, 2, 1, 2, 0],
  "Dsus2": [null, null, 0, 2, 3, 0],
  "Dsus4": [null, null, 0, 2, 3, 3],
  "Asus2": [null, 0, 2, 2, 0, 0],
  "Asus4": [null, 0, 2, 2, 3, 0],
  "Esus4": [0, 2, 2, 2, 0, 0],
};

function fretToFreq(stringIdx, fret) {
  return OPEN_STRING_FREQS[stringIdx] * Math.pow(2, fret / 12);
}

function getChordFreqs(name) {
  const shape = CHORD_SHAPES[name];
  if (!shape) throw new Error(`Hợp âm '${name}' chưa hỗ trợ`);
  const out = [];
  for (let i = 0; i < shape.length; i++) {
    if (shape[i] !== null) out.push(fretToFreq(i, shape[i]));
  }
  return out;
}

// ===========================================================================
// Karplus-Strong cải tiến (Extended KS, Jaffe-Smith)
// ===========================================================================
function makeKarplusStrongBuffer(ctx, freq, durationSec) {
  const sr = ctx.sampleRate;
  const nSamples = Math.floor(durationSec * sr);
  const bufLen = Math.max(2, Math.round(sr / freq));

  // 1. Khởi tạo bằng noise đã low-pass nhẹ -> attack ấm, không xèo xèo
  const buf = new Float32Array(bufLen);
  let prev = 0;
  const lpAlpha = 0.55;
  for (let i = 0; i < bufLen; i++) {
    const n = Math.random() * 2 - 1;
    prev = prev * lpAlpha + n * (1 - lpAlpha);
    buf[i] = prev;
  }

  // 2. Pluck position comb filter: mô phỏng gảy ở vị trí 13% chiều dài dây
  //    (gần ngựa đàn -> sáng, gần phím -> mềm). Tạo notch ở 1 số harmonic.
  const pluckPos = Math.max(1, Math.floor(bufLen * 0.13));
  const orig = new Float32Array(buf);
  for (let i = 0; i < bufLen; i++) {
    const delayed = i - pluckPos >= 0 ? orig[i - pluckPos] : 0;
    buf[i] = orig[i] - delayed * 0.5;
  }

  // 3. Vòng KS với decay tuỳ tần số (bass ngân lâu hơn) + stretch factor
  const out = ctx.createBuffer(1, nSamples, sr);
  const data = out.getChannelData(0);

  const decay = freq < 130 ? 0.99905
              : freq < 200 ? 0.99875
              : freq < 280 ? 0.99840
              : 0.99800;
  const stretch = 0.5;  // Jaffe-Smith stretch

  let idx = 0;
  for (let i = 0; i < nSamples; i++) {
    data[i] = buf[idx];
    const cur = buf[idx];
    const nxt = buf[(idx + 1) % bufLen];
    let newVal;
    if (Math.random() < stretch) {
      newVal = decay * 0.5 * (cur + nxt);   // áp lowpass
    } else {
      newVal = decay * cur;                  // không lowpass -> kéo dài sustain
    }
    buf[idx] = newVal;
    idx = (idx + 1) % bufLen;
  }
  return out;
}

// ===========================================================================
// Pattern parser
// ===========================================================================
function parsePattern(pattern) {
  const events = [];
  for (let i = 0; i < pattern.length; i++) {
    const ch = pattern[i];
    const beatOffset = i / 2;
    if (ch === "D" || ch === "d") events.push([beatOffset, "D"]);
    else if (ch === "U" || ch === "u") events.push([beatOffset, "U"]);
    else if (ch === "-" || ch === "." || ch === " " || ch === "_") continue;
    else throw new Error(`Pattern ký tự không hợp lệ: '${ch}'`);
  }
  if (events.length === 0) events.push([0, "D"]);
  return events;
}

// ===========================================================================
// Schedule 1 cú strum trong OfflineAudioContext
// ===========================================================================
function scheduleStrum(ctx, dest, chordName, time, direction, velocity) {
  const allFreqs = getChordFreqs(chordName);
  let freqs = direction === "D" ? allFreqs : allFreqs.slice().reverse();

  const strumSpread = direction === "D" ? 0.022 : 0.013;
  const perStringDelay = freqs.length > 1 ? strumSpread / (freqs.length - 1) : 0;

  for (let i = 0; i < freqs.length; i++) {
    const f = freqs[i];
    // Humanize timing per-string nhẹ
    const stringJitter = (Math.random() - 0.5) * 0.002;
    const startTime = Math.max(0, time + i * perStringDelay + stringJitter);

    const isBass = f < 150;
    const noteDuration = direction === "U" ? 1.4 : (isBass ? 3.2 : 2.2);

    const buffer = makeKarplusStrongBuffer(ctx, f, noteDuration);
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    // Detune ±3 cent -> mỗi dây không "đứng im" perfect, chord dày hơn
    src.detune.value = (Math.random() - 0.5) * 6;

    // Pan: dây trầm -> hơi trái, dây cao -> hơi phải (như mic 1 cây acoustic)
    const stringPos = direction === "D" ? i : (freqs.length - 1 - i);
    const pan = freqs.length > 1
      ? (stringPos / (freqs.length - 1) - 0.5) * 0.45
      : 0;

    let panNode;
    if (typeof ctx.createStereoPanner === "function") {
      panNode = ctx.createStereoPanner();
      panNode.pan.value = pan;
    } else {
      panNode = ctx.createPanner();
      panNode.panningModel = "equalpower";
      panNode.setPosition(pan, 0, 1 - Math.abs(pan));
    }

    const gainNode = ctx.createGain();
    const baseGain = direction === "D"
      ? velocity * (0.78 + 0.04 * i)
      : velocity * 0.62 * (1.0 - 0.05 * i);
    // Attack ramp 4ms -> mềm click
    gainNode.gain.setValueAtTime(0, startTime);
    gainNode.gain.linearRampToValueAtTime(baseGain, startTime + 0.004);

    src.connect(gainNode);
    gainNode.connect(panNode);
    panNode.connect(dest);

    src.start(startTime);
    src.stop(startTime + noteDuration + 0.05);
  }
}

// ===========================================================================
// Synthetic Impulse Response cho Convolver Reverb
// ===========================================================================
function makeIR(ctx, durationSec, decay, predelay = 0) {
  const sr = ctx.sampleRate;
  const length = Math.floor(durationSec * sr);
  const ir = ctx.createBuffer(2, length, sr);
  const preStart = Math.floor(predelay * sr);

  for (let ch = 0; ch < 2; ch++) {
    const data = ir.getChannelData(ch);
    for (let i = preStart; i < length; i++) {
      const t = (i - preStart) / (length - preStart);
      const env = Math.pow(1 - t, decay);
      data[i] = (Math.random() * 2 - 1) * env;
    }
    // Vài early reflection để có cảm giác không gian
    const taps = [0.011, 0.019, 0.031, 0.047, 0.071];
    for (const tt of taps) {
      const idx = preStart + Math.floor(tt * sr);
      if (idx < length) {
        data[idx] += (Math.random() * 2 - 1) * 0.35;
      }
    }
  }
  return ir;
}

// ===========================================================================
// Render offline -> AudioBuffer (stereo)
// ===========================================================================
async function renderOffline(chords, opts, sampleRate) {
  const { bpm, barsPerChord, beatsPerBar, pattern, tone, reverb } = opts;

  const secPerBeat = 60 / bpm;
  const secPerChord = secPerBeat * beatsPerBar * barsPerChord;
  const events = parsePattern(pattern);
  const patternLenBeats = beatsPerBar * barsPerChord;

  // Đuôi reverb dài hơn cho hall
  const tailSec = reverb >= 3 ? 3.5 : reverb >= 2 ? 2.5 : reverb >= 1 ? 1.8 : 0.8;
  const totalSec = secPerChord * chords.length + tailSec;

  const OfflineCtx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const ctx = new OfflineCtx(2, Math.floor(totalSec * sampleRate), sampleRate);

  // ----- Master chain: input -> HPF -> 3-band EQ -> compressor -> dry/wet -> dest
  const inputBus = ctx.createGain();
  inputBus.gain.value = 0.35;  // headroom trước khi qua chain

  const hpf = ctx.createBiquadFilter();
  hpf.type = "highpass";
  hpf.frequency.value = 75;
  hpf.Q.value = 0.7;

  // EQ tuỳ tone
  const eqLow = ctx.createBiquadFilter();
  eqLow.type = "peaking";
  eqLow.frequency.value = 130;
  eqLow.Q.value = 0.9;

  const eqMid = ctx.createBiquadFilter();
  eqMid.type = "peaking";
  eqMid.frequency.value = 700;
  eqMid.Q.value = 0.7;

  const eqHigh = ctx.createBiquadFilter();
  eqHigh.type = "peaking";
  eqHigh.frequency.value = 4200;
  eqHigh.Q.value = 0.7;

  if (tone === "warm") {
    eqLow.gain.value = 4.5;
    eqMid.gain.value = -3;
    eqHigh.gain.value = -1;
  } else if (tone === "bright") {
    eqLow.gain.value = 0.5;
    eqMid.gain.value = -1.5;
    eqHigh.gain.value = 4.5;
  } else {  // acoustic
    eqLow.gain.value = 2.5;
    eqMid.gain.value = -2;
    eqHigh.gain.value = 2.5;
  }

  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16;
  comp.knee.value = 6;
  comp.ratio.value = 3;
  comp.attack.value = 0.003;
  comp.release.value = 0.12;

  // Reverb config
  // 0 = không, 1 = phòng nhỏ, 2 = phòng lớn, 3 = hall
  const REVERB_PRESETS = [
    null,
    { dur: 1.2, decay: 2.8, pre: 0.012, mix: 0.18 },
    { dur: 2.0, decay: 2.5, pre: 0.020, mix: 0.28 },
    { dur: 3.0, decay: 2.2, pre: 0.030, mix: 0.38 },
  ];
  const revCfg = REVERB_PRESETS[reverb] || null;

  const dry = ctx.createGain();
  const wet = ctx.createGain();
  if (revCfg) {
    dry.gain.value = 1 - revCfg.mix;
    wet.gain.value = revCfg.mix * 1.2;
  } else {
    dry.gain.value = 1;
    wet.gain.value = 0;
  }

  const master = ctx.createGain();
  master.gain.value = 1.4;  // bù lại cho headroom đã giảm ở input

  // Connect graph
  inputBus.connect(hpf);
  hpf.connect(eqLow);
  eqLow.connect(eqMid);
  eqMid.connect(eqHigh);
  eqHigh.connect(comp);
  comp.connect(dry);
  dry.connect(master);

  if (revCfg) {
    const conv = ctx.createConvolver();
    conv.buffer = makeIR(ctx, revCfg.dur, revCfg.decay, revCfg.pre);
    comp.connect(conv);
    conv.connect(wet);
    wet.connect(master);
  }

  master.connect(ctx.destination);

  // Schedule strums
  for (let ci = 0; ci < chords.length; ci++) {
    const chordStart = ci * secPerChord;
    for (const [beatOffset, dir] of events) {
      const wrapped = beatOffset % patternLenBeats;
      const t = chordStart + wrapped * secPerBeat;
      // Humanize: timing ±6ms, velocity 0.85..1.0
      const tJitter = (Math.random() - 0.5) * 0.012;
      const vel = 0.85 + Math.random() * 0.15;
      scheduleStrum(ctx, inputBus, chords[ci], t + tJitter, dir, vel);
    }
  }

  return await ctx.startRendering();
}

// ===========================================================================
// Encode AudioBuffer -> WAV (stereo, 16-bit PCM)
// ===========================================================================
function audioBufferToWav(audioBuffer) {
  const numCh = audioBuffer.numberOfChannels;
  const sr = audioBuffer.sampleRate;
  const numSamples = audioBuffer.length;
  const bytesPerSample = 2;
  const blockAlign = numCh * bytesPerSample;
  const dataSize = numSamples * blockAlign;
  const fileSize = 44 + dataSize;

  const ab = new ArrayBuffer(fileSize);
  const view = new DataView(ab);
  let p = 0;
  const ws = (s) => { for (let i = 0; i < s.length; i++) view.setUint8(p++, s.charCodeAt(i)); };
  const w32 = (v) => { view.setUint32(p, v, true); p += 4; };
  const w16 = (v) => { view.setUint16(p, v, true); p += 2; };

  ws("RIFF"); w32(fileSize - 8); ws("WAVE");
  ws("fmt "); w32(16); w16(1); w16(numCh);
  w32(sr); w32(sr * blockAlign); w16(blockAlign); w16(16);
  ws("data"); w32(dataSize);

  const channels = [];
  for (let ch = 0; ch < numCh; ch++) channels.push(audioBuffer.getChannelData(ch));

  for (let i = 0; i < numSamples; i++) {
    for (let ch = 0; ch < numCh; ch++) {
      const v = Math.max(-1, Math.min(1, channels[ch][i]));
      view.setInt16(p, v * 32767, true);
      p += 2;
    }
  }
  return new Blob([ab], { type: "audio/wav" });
}

// ===========================================================================
// UI
// ===========================================================================
const $ = (id) => document.getElementById(id);
const chordsInput = $("chords");
const bpmInput = $("bpm");
const barsSelect = $("bars");
const patternSelect = $("pattern");
const toneSelect = $("tone");
const reverbSelect = $("reverb");
const playBtn = $("playBtn");
const stopBtn = $("stopBtn");
const downloadBtn = $("downloadBtn");
const statusEl = $("status");
const nowPlayingEl = $("nowPlaying");
const chordListEl = $("chordList");

Object.keys(CHORD_SHAPES).sort().forEach((name) => {
  const span = document.createElement("span");
  span.className = "pill";
  span.textContent = name;
  span.addEventListener("click", () => {
    const cur = chordsInput.value.trim();
    chordsInput.value = cur ? cur + " " + name : name;
    chordsInput.focus();
  });
  chordListEl.appendChild(span);
});

document.querySelectorAll("[data-preset]").forEach((el) => {
  el.addEventListener("click", () => {
    chordsInput.value = el.getAttribute("data-preset");
  });
});

let playCtx = null;
let currentSource = null;
let highlightTimers = [];

function setStatus(msg, kind = "") {
  statusEl.textContent = msg;
  statusEl.className = "status " + kind;
}

function parseChords() {
  const raw = chordsInput.value.replace(/,/g, " ").split(/\s+/).map((s) => s.trim()).filter(Boolean);
  if (raw.length === 0) throw new Error("Cần nhập ít nhất 1 hợp âm");
  const unknown = raw.filter((c) => !CHORD_SHAPES[c]);
  if (unknown.length > 0) throw new Error("Hợp âm chưa hỗ trợ: " + unknown.join(", "));
  return raw;
}

function getOpts() {
  const bpm = parseFloat(bpmInput.value);
  if (!isFinite(bpm) || bpm < 30 || bpm > 240) {
    throw new Error("BPM phải từ 30 đến 240");
  }
  return {
    bpm,
    barsPerChord: parseInt(barsSelect.value, 10),
    beatsPerBar: 4,
    pattern: patternSelect.value,
    tone: toneSelect.value,
    reverb: parseInt(reverbSelect.value, 10),
  };
}

function renderNowPlaying(chords) {
  nowPlayingEl.innerHTML = "";
  chords.forEach((c, i) => {
    const div = document.createElement("div");
    div.className = "chord-box";
    div.dataset.idx = i;
    div.textContent = c;
    nowPlayingEl.appendChild(div);
  });
}

function highlightChord(idx) {
  document.querySelectorAll(".chord-box").forEach((el) => {
    el.classList.toggle("active", parseInt(el.dataset.idx, 10) === idx);
  });
}

function clearHighlights() {
  highlightTimers.forEach((t) => clearTimeout(t));
  highlightTimers = [];
  document.querySelectorAll(".chord-box").forEach((el) => el.classList.remove("active"));
}

function secPerChordOf(opts) {
  return (60 / opts.bpm) * opts.beatsPerBar * opts.barsPerChord;
}

async function play() {
  try {
    const chords = parseChords();
    const opts = getOpts();
    renderNowPlaying(chords);
    setStatus("Đang render audio...", "loading");
    playBtn.disabled = true;

    if (!playCtx) playCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (playCtx.state === "suspended") await playCtx.resume();

    const sr = playCtx.sampleRate;
    // Yield trước khi render để UI cập nhật
    await new Promise((r) => setTimeout(r, 10));
    const t0 = performance.now();
    const rendered = await renderOffline(chords, opts, sr);
    const renderMs = (performance.now() - t0).toFixed(0);

    if (currentSource) { try { currentSource.stop(); } catch (e) {} }
    const src = playCtx.createBufferSource();
    src.buffer = rendered;
    src.connect(playCtx.destination);
    src.start();
    currentSource = src;

    setStatus(`Đang phát ${chords.length} hợp âm (${rendered.duration.toFixed(1)}s) — render ${renderMs}ms`, "success");
    stopBtn.disabled = false;

    clearHighlights();
    const spc = secPerChordOf(opts);
    chords.forEach((_, i) => {
      highlightTimers.push(setTimeout(() => highlightChord(i), i * spc * 1000));
    });

    src.onended = () => {
      playBtn.disabled = false;
      stopBtn.disabled = true;
      clearHighlights();
      if (currentSource === src) currentSource = null;
    };
  } catch (e) {
    setStatus("Lỗi: " + e.message, "error");
    playBtn.disabled = false;
    stopBtn.disabled = true;
  }
}

function stop() {
  if (currentSource) {
    try { currentSource.stop(); } catch (e) {}
    currentSource = null;
  }
  playBtn.disabled = false;
  stopBtn.disabled = true;
  clearHighlights();
  setStatus("Đã dừng.");
}

async function download() {
  try {
    const chords = parseChords();
    const opts = getOpts();
    setStatus("Đang render WAV (44.1 kHz stereo)...", "loading");
    downloadBtn.disabled = true;

    await new Promise((r) => setTimeout(r, 10));
    const rendered = await renderOffline(chords, opts, 44100);
    const blob = audioBufferToWav(rendered);

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `chord-strum-${chords.join("-")}.wav`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);

    const sizeMB = (blob.size / 1024 / 1024).toFixed(2);
    setStatus(`Đã tải: ${a.download} (${sizeMB} MB, ${rendered.duration.toFixed(1)}s)`, "success");
  } catch (e) {
    setStatus("Lỗi: " + e.message, "error");
  } finally {
    downloadBtn.disabled = false;
  }
}

playBtn.addEventListener("click", play);
stopBtn.addEventListener("click", stop);
downloadBtn.addEventListener("click", download);

chordsInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); play(); }
});
</script>
</body>
</html>
